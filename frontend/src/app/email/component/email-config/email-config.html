<div class="email-config">
  <h2>Email Settings</h2>
  <p class="description">Configure when and where to send tomorrow's daily.</p>

  <form (ngSubmit)="save()">
    <div class="field">
      <label for="emailAddress">Destination email address</label>
      <input
        id="emailAddress"
        type="email"
        [(ngModel)]="config.emailAddress"
        name="emailAddress"
        placeholder="you@example.com"
        required
      />
    </div>

    <div class="field">
      <label for="sendTime">Send time</label>
      <input
        id="sendTime"
        type="time"
        [(ngModel)]="config.sendTime"
        name="sendTime"
        required
      />
    </div>

    <button type="submit" [disabled]="isSaving()">
      {{ isSaving() ? 'Saving…' : 'Save' }}
    </button>

    @if (savedSuccessfully()) {
      <p class="success">Settings saved ✓</p>
    }
  </form>
</div>
