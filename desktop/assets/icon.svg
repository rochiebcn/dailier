<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo redondeado -->
  <rect width="256" height="256" rx="60" fill="#4A7C59" opacity="0.95"/>
  
  <!-- Calendario (marco) -->
  <rect x="40" y="50" width="176" height="160" rx="12" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Línea separadora (entre encabezado y días) -->
  <line x1="40" y1="90" x2="216" y2="90" stroke="#FFFFFF" stroke-width="6"/>
  
  <!-- Tres pequeños rectángulos para representar días de la semana -->
  <rect x="52" y="60" width="36" height="24" rx="4" fill="#89CFF0"/>
  <rect x="110" y="60" width="36" height="24" rx="4" fill="#89CFF0"/>
  <rect x="168" y="60" width="36" height="24" rx="4" fill="#89CFF0"/>
  
  <!-- Checkmark grande (símbolo de completado) -->
  <g transform="translate(128, 145)">
    <!-- Círculo de fondo -->
    <circle cx="0" cy="0" r="48" fill="#7AC74F"/>
    
    <!-- Checkmark (tic) -->
    <path d="M -20 0 L -5 15 L 25 -20" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Línea decorativa inferior -->
  <line x1="60" y1="200" x2="196" y2="200" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
</svg>
